<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-wallet2 me-2"></i>Expense Tracker
      </a>

      <button type="button" id="themeToggleButton" class="btn btn-outline-light btn-sm" aria-label="Toggle dark mode">
        <i class="bi bi-moon-stars-fill"></i> Dark Mode
      </button>
    </div>
  </nav>

  <main class="container my-4 my-md-5">

    <h1 class="text-center mb-4 fw-bold text-primary">Expenses</h1>

    <section class="row g-3 mb-4">

      <div class="col-12 col-sm-6 col-md-4">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body text-center p-3">
            <h6 class="card-subtitle mb-2 text-muted">Total Expenses</h6>
            <h2 class="card-title text-warning mb-0" id="totalExpenses">0</h2>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-4">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body text-center p-3">
            <h6 class="card-subtitle mb-2 text-muted">Number of Expenses</h6>
            <h2 class="card-title text-info mb-0" id="expenseCount">0</h2>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body text-center p-3">
            <h6 class="card-subtitle mb-2 text-muted">Highest Expense</h6>
            <h2 class="card-title text-danger mb-0" id="highestExpense">0</h2>
          </div>
        </div>
      </div>

    </section>

    <div id="formAlertContainer"></div>

    <section class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">

        <h2 class="card-title h4 mb-3 fw-bold">Add Expense</h2>

        <form id="expenseForm">
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" placeholder="Enter expense title">
              <div id="titleError" class="text-danger small mt-1"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="amount" placeholder="Enter amount" step="0.01">
              <div id="amountError" class="text-danger small mt-1"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="category" class="form-label">Category</label>

              <select id="category" class="form-select">
                <option value="">Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>

              <div id="categoryError" class="text-danger small mt-1"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="date" class="form-label">Date</label>

              <div class="input-group">
                <input type="date" class="form-control date-input" id="date" required>

                <button type="button" id="openDatePickerButton" class="btn btn-outline-secondary"
                  aria-label="Open date picker">
                  <i class="bi bi-calendar3"></i>
                </button>
              </div>

              <div id="dateError" class="text-danger small mt-1"></div>
            </div>

          </div>

          <div class="d-grid d-md-block">
            <button type="submit" class="btn btn-primary mt-3 px-4">
              <i class="bi bi-plus-lg me-1"></i>Add Expense
            </button>
          </div>
        </form>

      </div>
    </section>

    <div id="spinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <section class="card shadow-sm border-0 mb-4 p-3">
      <div class="row align-items-end g-3">

        <div class="col-12 col-md-5">
          <label for="categoryFilter" class="form-label fw-semibold">
            Filter by Category:
          </label>

          <select id="categoryFilter" class="form-select">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="col-12 col-md-5">
          <label for="monthFilter" class="form-label fw-semibold">
            Filter by Month:
          </label>

          <select id="monthFilter" class="form-select">
            <option value="">Select a month</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>

        <div class="col-12 col-md-2 d-grid d-md-block">
          <button type="button" id="exportCsvButton" class="btn btn-success">
            <i class="bi bi-download me-1"></i>Export CSV
          </button>
        </div>

      </div>
    </section>

    <div id="tableAlertContainer"></div>

    <section class="card shadow-sm border-0 overflow-hidden mb-4">
      <div class="table-responsive">

        <table class="table table-hover align-middle mb-0 custom-responsive-table">

          <thead class="table-dark">
            <tr>
              <th class="sortable-column" data-sort="title">
                Title
                <i class="bi bi-arrow-down-up"></i>
              </th>

              <th class="sortable-column" data-sort="amount">
                Amount
                <i class="bi bi-arrow-down-up"></i>
              </th>

              <th class="sortable-column" data-sort="category">
                Category
                <i class="bi bi-arrow-down-up"></i>
              </th>

              <th class="sortable-column" data-sort="date">
                Date
                <i class="bi bi-arrow-down-up"></i>
              </th>

              <th class="text-md-end">Actions</th>
            </tr>
          </thead>

          <tbody id="expensesTableBody"></tbody>

          <tfoot class="table-light">
            <tr>
              <th colspan="2" class="d-none d-md-table-cell">Summary</th>
              <th id="filteredCount" class="fw-bold">0 Expenses</th>
              <th id="filteredTotal" class="fw-bold text-primary">0.00</th>
              <th></th>
            </tr>
          </tfoot>

        </table>

      </div>
    </section>

    <section class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <h2 class="card-title h4 mb-3 fw-bold">Expenses by Category</h2>
        <div id="categoryChart" class="category-chart"></div>
      </div>
    </section>

    <div class="modal fade" id="editExpenseModal" tabindex="-1">

      <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 shadow">

          <div class="modal-header bg-primary text-white">

            <h2 class="modal-title fs-5">
              <i class="bi bi-pencil-square me-2"></i>
              Edit Expense
            </h2>

            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>

          </div>

          <div class="modal-body">

            <form id="editExpenseForm">

              <input type="hidden" id="editId">

              <div class="mb-3">
                <label for="editTitle" class="form-label">Title</label>

                <input type="text" class="form-control" id="editTitle">

                <div id="editTitleError" class="text-danger small mt-1"></div>
              </div>

              <div class="mb-3">
                <label for="editAmount" class="form-label">Amount</label>

                <input type="number" class="form-control" id="editAmount" step="0.01">

                <div id="editAmountError" class="text-danger small mt-1"></div>
              </div>

              <div class="mb-3">
                <label for="editCategory" class="form-label">
                  Category
                </label>

                <select id="editCategory" class="form-select">
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>

                <div id="editCategoryError" class="text-danger small mt-1"></div>
              </div>

              <div class="mb-3">
                <label for="editDate" class="form-label">Date</label>

                <input type="date" class="form-control" id="editDate">

                <div id="editDateError" class="text-danger small mt-1"></div>
              </div>

            </form>

          </div>

          <div class="modal-footer">

            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="submit" form="editExpenseForm" class="btn btn-primary">
              Save Changes
            </button>

          </div>

        </div>

      </div>

    </div>

    <div class="modal fade" id="deleteExpenseModal" tabindex="-1">

      <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 shadow">

          <div class="modal-header bg-danger text-white">

            <h2 class="modal-title fs-5">
              <i class="bi bi-exclamation-triangle me-2"></i>
              Confirm Delete
            </h2>

            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>

          </div>

          <div class="modal-body">
            Are you sure you want to delete this expense?
          </div>

          <div class="modal-footer">

            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="button" class="btn btn-danger" id="confirmDeleteButton">
              Delete
            </button>

          </div>

        </div>

      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
